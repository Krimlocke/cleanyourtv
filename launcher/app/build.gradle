plugins {
    id 'com.android.application'
}

android {
    namespace 'com.gathin.tvhome'
    compileSdk 34

    defaultConfig {
        // Opt-in identity for firmware with a package-name HOME allowlist.
        // Xiaomi: docs/devices/xiaomi-mitv-aetp0-dofus.md (com.ts.launcher).
        // ColorOS TV: docs/devices/oppo-k9-55-oppocnm632.md (com.oneplus.tv.launcher2).
        applicationId providers.gradleProperty('launcherApplicationId').getOrElse('com.gathin.tvhome')
        minSdk 26
        targetSdk 34
        versionCode 13
        versionName '3.4'
    }

    buildTypes {
        release {
            // R8 strips and optimises the code (AndroidX included): smaller APK, faster start on a slow TV CPU.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Sideloaded over ADB, never published: sign with the debug key so it installs over a debug build.
            signingConfig signingConfigs.debug
        }
    }

    packagingOptions {
        resources {
            // Kotlin metadata pulled in by AndroidX's dependencies. This launcher is plain Java and never reads it;
            // leaving it out saves about 14 KB of every install.
            excludes += ['kotlin/**', 'META-INF/*.version', 'META-INF/*.kotlin_module', 'DebugProbesKt.bin']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.dynamicanimation:dynamicanimation:1.0.0'
    // Test only (never in the APK): plain JVM tests for the module card validators, src/test.
    testImplementation 'junit:junit:4.13.2'
}

// my-tv fork: a version code that only goes up (minutes since 2026-01-01, or -PappVersionCode from the
// GitHub Actions release), so a build from GitHub installs over a build from this PC and the other way round.
androidComponents {
    onVariants(selector().all()) { variant ->
        int vc = providers.gradleProperty('appVersionCode')
                .map { it as Integer }
                .getOrElse(((System.currentTimeMillis().intdiv(1000L) - 1767225600L).intdiv(60L)) as Integer)
        variant.outputs.each { it.versionCode.set(vc) }
    }
}

// my-tv fork: sign with an explicit keystore when one is given (-PmytvKeystore=<path>, used by GitHub Actions),
// so the GitHub build carries the same key as the launcher already on the TVs.
def mytvKeystore = providers.gradleProperty('mytvKeystore')
if (mytvKeystore.isPresent()) {
    android.signingConfigs.debug.storeFile = file(mytvKeystore.get())
}
