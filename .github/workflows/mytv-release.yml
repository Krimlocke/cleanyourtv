# my-tv fork: rebase onto the original repo every night, build the launcher and publish it as a Release
# (tag build-<versionCode>, asset cleanyourtv-launcher.apk) for the launcher's built-in updater.
name: my-tv release

on:
  push:
    branches: [my-tv]
  schedule:
    - cron: '37 17 * * *'   # 03:37 Brisbane
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: my-tv-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: my-tv
          fetch-depth: 0

      - name: Rebase on the original repo
        id: sync
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "${{ github.event_name }}" = "push" ]; then echo "build=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          git remote add upstream https://github.com/Gathin23/cleanyourtv.git
          git fetch upstream main
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "Already up to date with the original repo."
            if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              echo "build=true" >> "$GITHUB_OUTPUT"
            else
              echo "build=false" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi
          if git rebase upstream/main; then
            git push --force-with-lease origin HEAD:my-tv
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            git rebase --abort
            title="Original repo update conflicts with my-tv"
            gh issue create --title "$title" --body "Rebasing my-tv onto Gathin23/cleanyourtv main ($(git rev-parse --short upstream/main)) hit a conflict. On the PC: git fetch upstream; git rebase upstream/main; fix the files; git rebase --continue; git push --force-with-lease." || true
            echo "::error::$title"
            exit 1
          fi

      - uses: actions/setup-java@v5
        if: steps.sync.outputs.build == 'true'
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK packages (runner's preinstalled SDK)
        if: steps.sync.outputs.build == 'true'
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          (yes || true) | "$SDKM" --licenses > /dev/null
          "$SDKM" "platforms;android-34" "build-tools;34.0.0" > /dev/null
          echo "sdk.dir=$ANDROID_HOME" > launcher/local.properties

      - name: Signing key (same key as the PC build)
        if: steps.sync.outputs.build == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then echo "::error::Add the DEBUG_KEYSTORE_B64 secret"; exit 1; fi
          mkdir -p ~/.android
          echo "$KEYSTORE_B64" | base64 -d > ~/.android/debug.keystore

      - name: Build launcher
        if: steps.sync.outputs.build == 'true'
        working-directory: launcher
        run: |
          VC=$(( ($(date +%s) - 1767225600) / 60 ))
          echo "VC=$VC" >> "$GITHUB_ENV"
          chmod +x gradlew
          ./gradlew assembleRelease -PappVersionCode=$VC --no-daemon --console=plain

      - name: Publish release
        if: steps.sync.outputs.build == 'true'
        run: |
          cp launcher/app/build/outputs/apk/release/app-release.apk cleanyourtv-launcher.apk
          gh release create "build-$VC" cleanyourtv-launcher.apk \
            --title "Build $VC" \
            --notes "my-tv at $(git rev-parse --short HEAD)" \
            --latest
