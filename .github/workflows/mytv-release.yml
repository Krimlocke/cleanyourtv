# my-tv fork: once a week, rebase onto the original repo's latest RELEASE (not its main branch), build the
# launcher and publish it as a Release
# (tag build-<versionCode>, asset cleanyourtv-launcher.apk) for the launcher's built-in updater.
name: my-tv release

on:
  push:
    branches: [my-tv]
  schedule:
    - cron: '37 10 * * 0'   # Sundays 20:37 Brisbane
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: my-tv-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: my-tv
          fetch-depth: 0

      - name: Rebase on the original repo's latest release
        id: sync
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "${{ github.event_name }}" = "push" ]; then echo "build=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          TAG=$(gh api repos/Gathin23/cleanyourtv/releases/latest --jq .tag_name)
          if [ -z "$TAG" ]; then echo "::error::Could not read the original repo's latest release"; exit 1; fi
          echo "Original repo's latest release: $TAG"
          git remote add upstream https://github.com/Gathin23/cleanyourtv.git
          git fetch --no-tags upstream "refs/tags/$TAG:refs/tags/upstream-$TAG"
          BASE="upstream-$TAG"
          if git merge-base --is-ancestor "$BASE" HEAD; then
            echo "my-tv already includes $TAG."
            if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              echo "build=true" >> "$GITHUB_OUTPUT"
            else
              echo "build=false" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi
          if git rebase "$BASE"; then
            git push --force-with-lease origin HEAD:my-tv
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            git rebase --abort
            title="Original repo release $TAG conflicts with my-tv"
            gh issue create --title "$title" --body "Rebasing my-tv onto Gathin23/cleanyourtv release $TAG hit a conflict. On the PC: git fetch upstream --tags; git rebase $TAG; fix the files; git rebase --continue; git push --force-with-lease." || true
            echo "::error::$title"
            exit 1
          fi

      - uses: actions/setup-java@v5
        if: steps.sync.outputs.build == 'true'
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK packages (runner's preinstalled SDK)
        if: steps.sync.outputs.build == 'true'
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          (yes || true) | "$SDKM" --licenses > /dev/null
          "$SDKM" "platforms;android-34" "build-tools;34.0.0" > /dev/null
          echo "sdk.dir=$ANDROID_HOME" > launcher/local.properties

      - name: Signing key (same key as the PC build)
        if: steps.sync.outputs.build == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then echo "::error::Add the DEBUG_KEYSTORE_B64 secret"; exit 1; fi
          KS="$RUNNER_TEMP/mytv.keystore"
          printf %s "$KEYSTORE_B64" | tr -d ' \r\n\t' | base64 -d > "$KS"
          echo "keystore: $(wc -c < "$KS") bytes"
          echo "MYTV_KEYSTORE=$KS" >> "$GITHUB_ENV"

      - name: Build launcher
        if: steps.sync.outputs.build == 'true'
        working-directory: launcher
        run: |
          VC=$(( ($(date +%s) - 1767225600) / 60 ))
          echo "VC=$VC" >> "$GITHUB_ENV"
          chmod +x gradlew
          ./gradlew assembleRelease -PappVersionCode=$VC -PmytvKeystore="$MYTV_KEYSTORE" --no-daemon --console=plain

      - name: Check the APK carries the TVs' signing key
        if: steps.sync.outputs.build == 'true'
        run: |
          EXPECTED=0474c4cdb73200983937a849443b872ba2b346cd11a455f0767ca18a85974592
          GOT=$("$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --print-certs launcher/app/build/outputs/apk/release/app-release.apk | sed -n 's/.*SHA-256 digest: //p' | head -1)
          echo "signer: $GOT"
          if [ "$GOT" != "$EXPECTED" ]; then echo "::error::APK signed with $GOT, the TVs expect $EXPECTED. Not publishing."; exit 1; fi

      - name: Publish release
        if: steps.sync.outputs.build == 'true'
        run: |
          cp launcher/app/build/outputs/apk/release/app-release.apk cleanyourtv-launcher.apk
          gh release create "build-$VC" cleanyourtv-launcher.apk \
            --title "Build $VC" \
            --notes "my-tv at $(git rev-parse --short HEAD)" \
            --latest
